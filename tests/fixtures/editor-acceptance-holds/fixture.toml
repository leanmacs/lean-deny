# The editor-project acceptance policy, cut down, over editor-ws, where every
# rule holds (exit 0). The host rules among them: the entry modules come from
# EditorSetRoot alone, so the fixture support module CompileTest.FixtureSupport,
# which only EditorSetFixtures imports, is neither an entry module nor a host
# root, and its import of Editor.Api, which the host reaches, makes no feature
# module of it (the old derivation, every root import but Editor's, gave deny
# rule 4 twice here, as editor-project acfed133 gave it three times); and
# reachable rule 1: every Editor.… module is
# Editor.Core or imported by it; and co-reach rule 1: every listed root that
# reaches Editor.Config.Elaborate (EditorSetRoot, EditorSetFixtures and
# CompileTest.Linked, through Editor.Headless) also reaches Editor; and
# target-config rule 1: every lean_lib and lean_exe of the six packages loads
# the lint plugin (package-level in the packages, per target in the core) or,
# for the core's Lint, LintTests and lint-test, imports Lint, lint-test
# through LintTest.Wait; and require-backed rule 1: every cross-package import
# is backed by a direct require; and doc-modules rule 1 and doc-packages rule
# 1: docs/design/packages.md, a miniature of editor-project's module map,
# lists every Editor.… module, and has a row for each of the five packages
# with its layer and requires (its second table, acp's, is not read).
run = "direct"
args = ["check", "--workspace", "../editor-ws", "--config", "lean-deny.toml"]
exit = 0
