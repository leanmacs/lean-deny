# A doc-modules rule over doc-ws that bites: section Missing lists Doc.A but not Doc.B.
[sets]
doc-mods = { select = ["mod:Doc"], except = ["mod:Doc!"] }

[[doc-modules]]
file = "docs/modules.md"
section = "Missing"
prefix = "Doc."
modules = "set:doc-mods"
reason = "the module map names every module"
