# A doc-modules rule over doc-ws that bites: section Extra lists Doc.Gone, which no module is; the fenced Doc.Fenced and the unprefixed Nat.succ are not listed.
[sets]
doc-mods = { select = ["mod:Doc"], except = ["mod:Doc!"] }

[[doc-modules]]
file = "docs/modules.md"
section = "Extra"
prefix = "Doc."
modules = "set:doc-mods"
reason = "the module map names every module"
