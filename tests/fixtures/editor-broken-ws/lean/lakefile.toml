name = "editor-core"

[[lean_lib]]
name = "Editor"
roots = ["Editor", "Editor.Core"]
plugins = ["@editor-core/lintShared"]

[[lean_lib]]
name = "FilesApi"
# No plugin: the one target target-config rule 1 reports.

[[lean_lib]]
name = "FilesApiTest"
globs = ["FilesApiTest.+"]
plugins = ["@editor-core/lintShared"]

[[lean_lib]]
name = "ModelTests"
globs = ["ModelTest.+"]
plugins = ["@editor-core/lintShared"]

[[lean_exe]]
name = "model-test"
root = "ModelTest"
plugins = ["@editor-core/lintShared"]

# The linters, which load no plugin: Lint imports Lint.Wait, LintTest.Wait
# imports Lint.Wait, and the lint-test root reaches it only through
# LintTest.Wait (target-config rule 1's or-imports).
[[lean_lib]]
name = "Lint"
globs = ["Lint.*"]

[[lean_lib]]
name = "LintTests"
globs = ["LintTest.+"]

[[lean_exe]]
name = "lint-test"
root = "LintTest"
