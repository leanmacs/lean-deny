# lean-deny as this package's lint driver: `lake lint` runs `lean-deny check`.
name = "lake-lint-violation"
lintDriver = "«lean-deny»/«lean-deny»"
lintDriverArgs = ["check"]

[[require]]
name = "lean-deny"
path = "../../.."

[[lean_lib]]
name = "LintBites"
globs = ["LintBites.*"]  # LintBites.lean and everything under LintBites/
