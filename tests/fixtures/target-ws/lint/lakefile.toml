# The linters, which load no plugin: Lint imports Lint.Wait, LintTest.Wait
# imports Lint.Wait directly, and the lint-test root reaches it only through
# LintTest.Wait.
name = "lint"

[[lean_lib]]
name = "Lint"
globs = ["Lint.*"]

[[lean_lib]]
name = "LintTests"
globs = ["LintTest.+"]

[[lean_exe]]
name = "lint-test"
root = "LintTest"
