# A doc-modules rule over doc-ws that holds: section Exact lists Doc.A and Doc.B, among non-names, duplicates and a deeper subsection.
[sets]
doc-mods = { select = ["mod:Doc"], except = ["mod:Doc!"] }

[[doc-modules]]
file = "docs/modules.md"
section = "Exact"
prefix = "Doc."
modules = "set:doc-mods"
reason = "the module map names every module"
