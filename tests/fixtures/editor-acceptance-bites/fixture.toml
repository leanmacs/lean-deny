# The same policy over editor-broken-ws, where each of its fourteen rules bites
# (exit 1): one breaking import per rule of the first eleven (deny rule 5:
# Shell.EditorPackage imports Std.Data.HashMap; deny rule 6:
# Compile.EditorPackage imports the fixture support module
# CompileTest.FixtureSupport, so EditorSetRoot reaches it), two more for
# deny rule 5 (ShippedThemes.EditorPackage imports the core module
# Editor.Api and Lean.Data.Json, so its pkg:editor-core and external:Lean
# targets bite too), a second for allow-only rule 4 (the linked root
# imports Editor.Window.Real, which its `except` excludes), and a second for deny rule 4 (Editor.Test.Fixture.Main
# imports ShippedThemes.EditorPackage, an entry module only the declared
# roots name, as the acceptance edit host-shipped-themes does); and, for
# reachable rule 1, the module Editor.Test.Shell, which only a package test
# imports, outside Editor.Core's closure; and, for co-reach rule 1, the
# fixture-harness root EditorSetFixtures, which reaches
# Editor.Config.Elaborate through Editor.Headless but no longer imports the
# config base Editor; and, for target-config rule 1, the core's library
# FilesApi, which loads no plugin and imports no Lint; as
# docs/editor-project-acceptance.md lists.
run = "direct"
args = ["check", "--workspace", "../editor-broken-ws", "--config", "../editor-acceptance-holds/lean-deny.toml"]
exit = 1
