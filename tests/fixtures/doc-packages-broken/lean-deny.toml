# A doc-packages rule over doc-pkg-ws that bites with one violation of each
# kind: no row for impl, a row for gone, and api's row with the wrong layer
# and an extra require.
[layers]
classify = [{ layer = "core", select = "pkg:core" }, { layer = "interface", select = "pkg:api" }]
default = "implementation"
allow = [
  ["implementation", "implementation"],
  ["implementation", "core"],
  ["implementation", "interface"],
  ["interface", "core"],
]

[[doc-packages]]
file = "docs/packages.md"
section = "Broken"
package-column = "Package"
layer-column = "Layer"
requires-column = "Requires"
packages = ["pkg:api", "pkg:impl"]
requires-except = "core"
reason = "the package table has one row per package"
