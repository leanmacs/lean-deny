name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # elan reads `lean-toolchain`, so the pinned Lean is what runs.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache toolchain and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.elan/toolchains
            .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-

      - name: Build and test
        run: lake build --wfail && lake test

      # lean-fmt (docs/development.md), hosted in tools/lean-fmt. A cache
      # of its own, so a source change does not evict the formatter build.
      - name: Cache lean-fmt
        uses: actions/cache@v6
        with:
          path: tools/lean-fmt/.lake
          key: lean-fmt-${{ runner.os }}-${{ hashFiles('tools/lean-fmt/lean-toolchain', 'tools/lean-fmt/lakefile.toml', 'tools/lean-fmt/lake-manifest.json') }}

      # After `Build and test`: `check` reads the built .olean files.
      - name: Check formatting
        run: lake -d tools/lean-fmt exe lean-fmt format --check --root .

      - name: Check lints
        run: lake -d tools/lean-fmt exe lean-fmt check --root .

      - name: Check the tree is clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
