# lean-fmt's config (README, "Development"). Everything outside tests/ is
# checked with the defaults. tests/ holds the fixtures: separate Lake
# workspaces, several deliberately malformed (e.g. `import 42`), whose
# bytes are pinned by their expected outputs, so neither format nor check
# may read or rewrite them.
exclude = ["tests/**"]

[lint]
# FMT004 (redundant import) on LeanDeny.lean: it is the `LeanDeny` lib's root
# module, whose job is to import every module of the library by name, and the
# lib builds exactly what it reaches. Keeping only the imports FMT004 leaves
# would make the library's contents depend on what LeanDeny.Check happens to
# import, so a later refactor there could silently drop a module.
per-file-ignores = { "LeanDeny.lean" = ["FMT004"] }
